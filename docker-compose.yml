services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kl_observatory
      POSTGRES_USER: kl_observatory
      POSTGRES_PASSWORD: kl_observatory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kl_observatory -d kl_observatory"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: poetry run uvicorn kl_observatory.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://kl_observatory:kl_observatory@postgres:5432/kl_observatory
      TRACKING_ROOT: /workspace/AI_Tracking
      API_BASE_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ../AI_Tracking:/workspace/AI_Tracking:ro

  dashboard:
    build: .
    command: poetry run streamlit run src/kl_observatory/dashboard.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_BASE_URL: http://api:8000
      TRACKING_ROOT: /workspace/AI_Tracking
    depends_on:
      api:
        condition: service_started
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./.streamlit:/app/.streamlit:ro
      - ../AI_Tracking:/workspace/AI_Tracking:ro

volumes:
  postgres_data:
